apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-service
  template:
    metadata:
      labels:
        app: api-service
    spec:
      containers:
        - name: api-service
          image: ghcr.io/aet-devops26/team-hallucination-detectors-api-service:latest
          ports:
            - containerPort: 8080
          env:
            - name: VIBESHIELD_CORS_ALLOWED_ORIGINS
              value: "http://localhost:3000,https://ge65poj.stud.k8s.aet.cit.tum.de"
