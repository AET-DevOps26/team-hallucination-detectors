apiVersion: apps/v1
kind: Deployment
metadata:
  name: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app: database
  template:
    metadata:
      labels:
        app: database
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: database
          # pgvector/pgvector:pg16 is the official postgres:16 image with the
          # `vector` extension compiled in - same major version, same on-disk
          # format, so this is a safe drop-in swap of the previous postgres:16
          # image (existing data on the postgres-data PVC is unaffected).
          image: pgvector/pgvector:pg16
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: vibeshield
            - name: POSTGRES_USER
              value: vibeshield
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vibeshield-secrets
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
              subPath: postgres
          resources:
            limits:
              memory: "512Mi"
              cpu: "500m"
            requests:
              memory: "256Mi"
              cpu: "100m"
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - vibeshield
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-data
