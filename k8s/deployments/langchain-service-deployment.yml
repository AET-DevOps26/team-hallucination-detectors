apiVersion: apps/v1
kind: Deployment
metadata:
  name: langchain-service
spec:
  # replicas is intentionally unset — the HorizontalPodAutoscaler (k8s/hpa.yml)
  # owns the replica count. Setting it here would fight the HPA on every apply.
  selector:
    matchLabels:
      app: langchain-service
  template:
    metadata:
      labels:
        app: langchain-service
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: langchain-service
          image: ghcr.io/aet-devops26/team-hallucination-detectors-langchain-service:latest
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8000
          env:
            - name: MODEL_NAME
              value: "gpt-4o-mini"
            - name: OPENAI_BASE_URL
              value: "https://api.openai.com/v1"
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: vibeshield-secrets
                  key: OPENAI_API_KEY
                  optional: true
            - name: LOGOS_BASE_URL
              value: "https://logos.aet.cit.tum.de/v1"
            - name: LOGOS_MODEL_NAME
              value: "openai/gpt-oss-120b"
            - name: LOGOS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: vibeshield-secrets
                  key: LOGOS_API_KEY
                  optional: true
            - name: SELFHOSTED_BASE_URL
              value: "http://ollama:11434/v1"
            - name: SELFHOSTED_MODEL_NAME
              value: "llama3.2:3b"
            - name: SELFHOSTED_API_KEY
              value: "ollama"
            # RAG knowledge base (app/db.py, app/retrieval.py). Own schema in
            # the shared vibeshield Postgres (see app/db.py SCHEMA_NAME); no
            # DATABASE_URL means retrieval stays disabled (additive grounding,
            # not a hard dependency). EMBEDDING_API_KEY isn't set here on
            # purpose: it falls back to OPENAI_API_KEY above when unset.
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vibeshield-secrets
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: "postgresql+asyncpg://vibeshield:$(POSTGRES_PASSWORD)@database:5432/vibeshield"
          resources:
            limits:
              memory: "1Gi"
              cpu: "1000m"
            requests:
              memory: "512Mi"
              cpu: "200m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
