# Not applied directly — CD generates this Secret at deploy time from the
# GRAFANA_ADMIN_PASSWORD GitHub Actions secret (see .github/workflows/cd.yml)
# so the real password is never committed. Kept here only to document the
# expected shape for local/manual cluster setup.
apiVersion: v1
kind: Secret
metadata:
  name: grafana-credentials
  namespace: ge65poj
type: Opaque
stringData:
  admin-user: admin
  admin-password: CHANGE_ME
