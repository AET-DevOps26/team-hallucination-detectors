# Raw-manifest equivalent of helm/vibeshield/templates/secret.yml.
# Values must be base64-encoded. Generate with:
#   echo -n "value" | base64
#
# For production, populate via CI (never commit real values):
#   kubectl create secret generic vibeshield-secrets -n ge65poj \
#     --from-literal=POSTGRES_PASSWORD=<pw> \
#     --from-literal=SPRING_DATASOURCE_PASSWORD=<pw> \
#     --from-literal=APP_JWT_SECRET=<secret> \
#     --from-literal=OPENAI_API_KEY=<key> \
#     --dry-run=client -o yaml | kubectl apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: vibeshield-secrets
  namespace: ge65poj
type: Opaque
stringData:
  POSTGRES_PASSWORD: "vibeshield"
  SPRING_DATASOURCE_PASSWORD: "vibeshield"
  APP_JWT_SECRET: "dev-secret-change-in-production"
  OPENAI_API_KEY: ""