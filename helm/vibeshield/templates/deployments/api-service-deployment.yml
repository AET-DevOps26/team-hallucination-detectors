apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-service
  template:
    metadata:
      labels:
        app: api-service
    spec:
      containers:
        - name: api-service
          image: "{{ .Values.images.apiService }}:{{ .Values.images.tag }}"
          env:
            - name: SPRING_FLYWAY_BASELINE_ON_MIGRATE
              value: "true"
            - name: SPRING_FLYWAY_BASELINE_VERSION
              value: "0"
            - name: APP_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: vibeshield-secrets
                  key: APP_JWT_SECRET
          ports:
            - containerPort: 8080
