apiVersion: apps/v1
kind: Deployment
metadata:
  name: langchain-service
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: 1
  {{- end }}
  selector:
    matchLabels:
      app: langchain-service
  template:
    metadata:
      labels:
        app: langchain-service
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: langchain-service
          image: "{{ .Values.images.langchainService }}:{{ .Values.images.tag }}"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8000
          env:
            - name: MODEL_NAME
              value: "{{ .Values.langchainService.modelName }}"
            - name: OPENAI_BASE_URL
              value: "{{ .Values.langchainService.openaiBaseUrl }}"
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: vibeshield-secrets
                  key: OPENAI_API_KEY
                  optional: true
            - name: LOGOS_BASE_URL
              value: "{{ .Values.langchainService.logosBaseUrl }}"
            - name: LOGOS_MODEL_NAME
              value: "{{ .Values.langchainService.logosModelName }}"
            - name: LOGOS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: vibeshield-secrets
                  key: LOGOS_API_KEY
                  optional: true
            - name: SELFHOSTED_BASE_URL
              value: "{{ .Values.langchainService.selfhostedBaseUrl }}"
            - name: SELFHOSTED_MODEL_NAME
              value: "{{ .Values.langchainService.selfhostedModelName }}"
            - name: SELFHOSTED_API_KEY
              value: "{{ .Values.langchainService.selfhostedApiKey }}"
            # RAG knowledge base (app/db.py, app/retrieval.py). Own schema in
            # the shared vibeshield Postgres (see app/db.py SCHEMA_NAME); no
            # DATABASE_URL means retrieval stays disabled (additive grounding,
            # not a hard dependency). EMBEDDING_API_KEY isn't set here on
            # purpose: it falls back to OPENAI_API_KEY above when unset.
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vibeshield-secrets
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: "postgresql+asyncpg://{{ .Values.database.user }}:$(POSTGRES_PASSWORD)@database:5432/{{ .Values.database.name }}"
            - name: APP_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: vibeshield-secrets
                  key: APP_JWT_SECRET
            - name: OTEL_SERVICE_NAME
              value: "langchain-service"
            # gRPC, not http/protobuf: the Python OTLP HTTP exporter silently
            # stops sending spans after ~13 minutes of uptime with no logged
            # error (confirmed via Tempo's own span-received counter staying
            # flat). gRPC has run cleanly for 30+ minutes in the same test.
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://tempo:4317"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "grpc"
            - name: OTEL_TRACES_EXPORTER
              value: "otlp"
            - name: OTEL_METRICS_EXPORTER
              value: "none"
            - name: OTEL_LOGS_EXPORTER
              value: "none"
          resources:
            limits:
              memory: "1Gi"
              cpu: "1000m"
            requests:
              memory: "512Mi"
              cpu: "200m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
