apiVersion: apps/v1
kind: Deployment
metadata:
  name: langchain-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: langchain-service
  template:
    metadata:
      labels:
        app: langchain-service
    spec:
      containers:
        - name: langchain-service
          image: "{{ .Values.images.langchainService }}:{{ .Values.images.tag }}"
          ports:
            - containerPort: 8000
          env:
            - name: MODEL_NAME
              value: "{{ .Values.langchainService.modelName }}"
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: vibeshield-secrets
                  key: OPENAI_API_KEY