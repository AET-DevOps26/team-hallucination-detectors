apiVersion: apps/v1
kind: Deployment
metadata:
  name: langchain-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: langchain-service
  template:
    metadata:
      labels:
        app: langchain-service
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: langchain-service
          image: "{{ .Values.images.langchainService }}:{{ .Values.images.tag }}"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8000
          env:
            - name: MODEL_NAME
              value: "{{ .Values.langchainService.modelName }}"
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: vibeshield-secrets
                  key: OPENAI_API_KEY
          resources:
            limits:
              memory: "1Gi"
              cpu: "1000m"
            requests:
              memory: "512Mi"
              cpu: "200m"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
