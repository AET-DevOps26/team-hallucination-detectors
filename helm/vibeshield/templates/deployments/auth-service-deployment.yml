apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: "{{ .Values.images.authService }}:{{ .Values.images.tag }}"
          env:
            - name: APP_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: vibeshield-secrets
                  key: APP_JWT_SECRET
          ports:
            - containerPort: 8080
