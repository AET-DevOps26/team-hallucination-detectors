apiVersion: v1
kind: Secret
metadata:
  name: vibeshield-secrets
type: Opaque
stringData:
  POSTGRES_PASSWORD: "{{ .Values.secrets.dbPassword }}"
  APP_JWT_SECRET: "{{ .Values.secrets.jwtSecret }}"
  SPRING_DATASOURCE_PASSWORD: "{{ .Values.secrets.dbPassword }}"
  OPENAI_API_KEY: "{{ .Values.secrets.openaiApiKey }}"
  LOGOS_API_KEY: "{{ .Values.secrets.logosApiKey }}"
  SPRING_MAIL_PASSWORD: "{{ .Values.secrets.smtpPassword }}"
