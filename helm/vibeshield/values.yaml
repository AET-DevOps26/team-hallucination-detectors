global:
  host: ge65poj.stud.k8s.aet.cit.tum.de

images:
  apiService: ghcr.io/aet-devops26/team-hallucination-detectors-api-service
  authService: ghcr.io/aet-devops26/team-hallucination-detectors-auth-service
  client: ghcr.io/aet-devops26/team-hallucination-detectors-client
  langchainService: ghcr.io/aet-devops26/team-hallucination-detectors-langchain-service
  scannerService: ghcr.io/aet-devops26/team-hallucination-detectors-scanner-service
  tag: latest

authService:
  passwordResetPageUrl: "https://ge65poj.stud.k8s.aet.cit.tum.de/reset-password"
  mail:
    host: ""
    port: 587
    username: ""
    from: "no-reply@vibeshield.local"
    smtpAuth: true
    starttls: true

langchainService:
  modelName: "gpt-4o-mini"
  openaiBaseUrl: "https://api.openai.com/v1"
  logosBaseUrl: "https://logos.aet.cit.tum.de/v1"
  logosModelName: "openai/gpt-oss-120b"
  # Self-hosted provider — points at the in-cluster ollama Service. The key is a
  # dummy Ollama ignores; blank it to disable the "selfhosted" provider (callers
  # then get 503 PROVIDER_NOT_CONFIGURED).
  selfhostedApiKey: "ollama"
  selfhostedBaseUrl: "http://ollama:11434/v1"
  selfhostedModelName: "llama3.2:3b"

# In-cluster self-hosted LLM runtime (Ollama). CPU-only on the course cluster,
# so keep to a small model. Weights persist on a PVC across restarts.
ollama:
  image: "ollama/ollama:latest"
  model: "llama3.2:3b"
  storage: 8Gi
  resources:
    requests:
      memory: "2Gi"
      cpu: "500m"
    limits:
      memory: "4Gi"
      cpu: "2000m"

database:
  name: vibeshield
  user: vibeshield
  password: vibeshield
  storage: 1Gi

secrets:
  # Override via --set in CI (never commit real values here)
  jwtSecret: "dev-secret-change-in-production"
  dbPassword: vibeshield
  openaiApiKey: ""
  logosApiKey: ""
  smtpPassword: ""

autoscaling:
  enabled: true
