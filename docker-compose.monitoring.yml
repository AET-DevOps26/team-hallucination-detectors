# Monitoring overlay — run alongside the main stack:
#   docker compose -f docker-compose.yml -f docker-compose.monitoring.yml up
#
# Adds Prometheus, Grafana, and Loki to the same default network so Prometheus
# can scrape Spring Boot /actuator/prometheus and FastAPI /metrics endpoints.
services:
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: vibeshield-prometheus
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/rules.yml:/etc/prometheus/rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.console.libraries=/etc/prometheus/console_libraries
      - --web.console.templates=/etc/prometheus/consoles
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.2.0
    container_name: vibeshield-grafana
    depends_on:
      - prometheus
      - loki
      - tempo
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_FEATURE_TOGGLES_ENABLE: logsInExplore
      GF_LOG_CONSOLECOLORS: "true"
    volumes:
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"

  loki:
    image: grafana/loki:3.0.0
    container_name: vibeshield-loki
    volumes:
      - ./monitoring/loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"

  promtail:
    image: grafana/promtail:3.0.0
    container_name: vibeshield-promtail
    volumes:
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/config.yml

  tempo:
    image: grafana/tempo:2.5.0
    container_name: vibeshield-tempo
    volumes:
      - ./monitoring/tempo/tempo-config.yaml:/etc/tempo/tempo-config.yaml:ro
      - tempo_data:/var/tempo
    command: -config.file=/etc/tempo/tempo-config.yaml
    ports:
      - "3200:3200"   # Tempo query API (Grafana datasource)
      - "4317:4317"   # OTLP gRPC receiver
      - "4318:4318"   # OTLP HTTP receiver (used by services; simpler than gRPC/h2c)

volumes:
  prometheus_data:
  grafana_data:
  loki_data:
  tempo_data: