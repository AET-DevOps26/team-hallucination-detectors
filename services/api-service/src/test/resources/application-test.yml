# Test profile: in-memory H2 in PostgreSQL compatibility mode (same pattern as the
# auth-service) so the suite needs no external database. Flyway runs the real
# migrations, Hibernate validates the mapping against the migrated schema.

# The scheduled worker is disabled in tests; worker tests call it directly.
scan:
  worker:
    enabled: false

spring:
  datasource:
    url: jdbc:h2:mem:apitest;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: api_service
  flyway:
    enabled: true
    default-schema: api_service
    schemas: api_service
