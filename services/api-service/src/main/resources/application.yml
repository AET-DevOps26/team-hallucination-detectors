server:
  port: 8080

spring:
  application:
    name: api-service
  datasource:
    # Defaults target the docker-compose / k8s service name; override per environment.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://database:5432/vibeshield}
    username: ${SPRING_DATASOURCE_USERNAME:vibeshield}
    password: ${SPRING_DATASOURCE_PASSWORD:vibeshield}
  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate only checks the mapping against it.
      ddl-auto: validate
  flyway:
    enabled: true

app:
  jwt:
    # Shared HMAC secret used to VALIDATE tokens issued by the auth-service —
    # must be identical in both services (see docs/auth.md). The fallback is a
    # dev-only placeholder; deployed environments must set APP_JWT_SECRET.
    secret: ${APP_JWT_SECRET:dev-secret-key-change-me-minimum-32-chars!!}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
