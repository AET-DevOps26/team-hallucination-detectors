server:
  port: 8080

spring:
  application:
    name: api-service
  datasource:
    # Defaults target the docker-compose / k8s service name; override per environment.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://database:5432/vibeshield}
    username: ${SPRING_DATASOURCE_USERNAME:vibeshield}
    password: ${SPRING_DATASOURCE_PASSWORD:vibeshield}
  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate only checks the mapping against it.
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0

# Background scan execution: where the scanner-service lives and how often the
# worker polls for Pending scans. The scans table is the work queue.
scanner:
  base-url: ${SCANNER_URL:http://scanner-service:8080}
  read-timeout-ms: ${SCANNER_READ_TIMEOUT_MS:180000}

scan:
  worker:
    enabled: true
    poll-interval-ms: 2000
    # Stale-running recovery: a scan claimed by a worker that then crashed is failed
    # once it has been Running longer than running-timeout-ms. The timeout must stay
    # well above the worst-case real scan duration (request-budget x scanner timeout).
    running-timeout-ms: ${SCAN_WORKER_RUNNING_TIMEOUT_MS:300000}
    recovery-interval-ms: ${SCAN_WORKER_RECOVERY_INTERVAL_MS:60000}

app:
  jwt:
    # Shared HMAC secret used to VALIDATE tokens issued by the auth-service —
    # must be identical in both services (see docs/auth.md). The fallback is a
    # dev-only placeholder; deployed environments must set APP_JWT_SECRET.
    secret: ${APP_JWT_SECRET:dev-secret-key-change-me-minimum-32-chars!!}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /api/swagger-ui.html
    url: /openapi.yaml
  api-docs:
    path: /api/v3/api-docs
