## Test profile: swaps the Postgres datasource for an in-memory H2 database so
## integration tests run anywhere (CI, laptop) without a live Postgres container.
spring:
  datasource:
    url: jdbc:h2:mem:authtest;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  flyway:
    default-schema: auth_service
    schemas: auth_service
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        default_schema: auth_service

app:
  jwt:
    secret: integration-test-secret-key-minimum-32-characters!!
    expiration-ms: 3600000
