server:
  port: 8080

spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://database:5432/vibeshield?currentSchema=auth_service
    username: vibeshield
    password: ${SPRING_DATASOURCE_PASSWORD:vibeshield}
  flyway:
    default-schema: auth_service
    schemas: auth_service

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: auth_service

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    distribution:
      # Emit http_server_requests_seconds_bucket so histogram_quantile-based
      # latency alerts (SlowResponseTime) and P95 dashboards actually have
      # buckets to work with — without this only count/sum are exported.
      percentiles-histogram:
        http.server.requests: true

springdoc:
  swagger-ui:
    path: /api/v1/auth/swagger-ui.html
  api-docs:
    path: /api/v1/auth/v3/api-docs
