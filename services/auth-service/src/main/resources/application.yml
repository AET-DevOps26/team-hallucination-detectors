server:
  port: 8080

spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://database:5432/vibeshield?currentSchema=auth_service
    username: vibeshield
    password: ${SPRING_DATASOURCE_PASSWORD:vibeshield}
  flyway:
    default-schema: auth_service
    schemas: auth_service

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: auth_service
  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${SPRING_MAIL_SMTP_STARTTLS_ENABLE:false}
    test-connection: false

app:
  password-reset:
    mail-from: ${PASSWORD_RESET_MAIL_FROM:no-reply@vibeshield.local}
    page-url: ${PASSWORD_RESET_PAGE_URL:http://localhost:3000/reset-password}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /api/v1/auth/swagger-ui.html
  api-docs:
    path: /api/v1/auth/v3/api-docs
