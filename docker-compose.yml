services:
  api-service:
    build:
      context: ./services/api-service
    container_name: vibeshield-api
    depends_on:
      - database
      - scanner-service
    environment:
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-${POSTGRES_PASSWORD}}
      APP_JWT_SECRET: ${APP_JWT_SECRET:-dev-secret-change-me-minimum-32-chars-required}
      OTEL_SERVICE_NAME: api-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318
      OTEL_TRACES_EXPORTER: otlp
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 10
  auth-service:
    build:
      context: ./services/auth-service
    container_name: vibeshield-auth
    depends_on:
      - database
    environment:
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-${POSTGRES_PASSWORD}}
      APP_JWT_SECRET: ${APP_JWT_SECRET:-dev-secret-change-me-minimum-32-chars-required}
      OTEL_SERVICE_NAME: auth-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318
      OTEL_TRACES_EXPORTER: otlp
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 10

  scanner-service:
    build:
      context: ./services/scanner-service
    container_name: vibeshield-scanner
    # Internal-only: reached by the api-service as http://scanner-service:8080.
    # Deliberately no published ports and no gateway route.
    environment:
      OTEL_SERVICE_NAME: scanner-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318
      OTEL_TRACES_EXPORTER: otlp
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
    expose:
      - "8080"

  langchain-service:
    build:
      context: ./services/langchain-service
    container_name: vibeshield-langchain
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      MODEL_NAME: ${LANGCHAIN_MODEL_NAME:-gpt-4o-mini}
      LOGOS_API_KEY: ${LOGOS_API_KEY:-}
      LOGOS_BASE_URL: ${LOGOS_BASE_URL:-https://logos.aet.cit.tum.de/v1}
      LOGOS_MODEL_NAME: ${LOGOS_MODEL_NAME:-openai/gpt-oss-120b}
      SELFHOSTED_API_KEY: ${SELFHOSTED_API_KEY:-ollama}
      SELFHOSTED_BASE_URL: ${SELFHOSTED_BASE_URL:-http://ollama:11434/v1}
      SELFHOSTED_MODEL_NAME: ${SELFHOSTED_MODEL_NAME:-llama3.2:3b}
      OTEL_SERVICE_NAME: langchain-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4317
      OTEL_TRACES_EXPORTER: otlp
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 10

  # Self-hosted, OpenAI-compatible LLM runtime for the "selfhosted" provider.
  # On first boot it pulls the configured model, then serves the OpenAI-compatible
  # API on :11434. Weights are cached in the ollama_models volume so restarts are
  # fast. CPU-only inference is slow — keep to small models (1B–3B).
  #
  # Prewarm: after the pull we fire a throwaway generation so the model is loaded
  # into RAM at container start (a CPU cold start is ~40s and otherwise lands on
  # the first user request). OLLAMA_KEEP_ALIVE=-1 keeps it resident indefinitely
  # instead of unloading it after the default 5m idle window.
  ollama:
    profiles: [ollama]
    image: ollama/ollama:latest
    container_name: vibeshield-ollama
    environment:
      OLLAMA_KEEP_ALIVE: "-1"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama serve &
        until ollama list >/dev/null 2>&1; do sleep 1; done
        MODEL="${SELFHOSTED_MODEL_NAME:-llama3.2:3b}"
        ollama pull "$$MODEL"
        echo "Prewarming $$MODEL into memory..."
        ollama run "$$MODEL" "ok" >/dev/null 2>&1 || true
        echo "Prewarm complete; $$MODEL is resident."
        wait
    expose:
      - "11434"
    volumes:
      - ollama_models:/root/.ollama

  client:
    build:
      context: ./client
      args:
        VITE_API_BASE_URL: ""
        VITE_AUTH_BASE_URL: /auth
    container_name: vibeshield-client
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 3s
      retries: 10
  gateway:
    image: nginx:alpine
    container_name: vibeshield-gateway
    ports:
      - "3000:80"
      - "3443:443"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./gateway/certs:/etc/nginx/certs:ro
    depends_on:
      client:
        condition: service_healthy
      api-service:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      langchain-service:
        condition: service_healthy
  database:
    image: postgres:16
    container_name: vibeshield-db
    environment:
      POSTGRES_DB: vibeshield
      POSTGRES_USER: vibeshield
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
volumes:
    postgres_data:
    ollama_models:
