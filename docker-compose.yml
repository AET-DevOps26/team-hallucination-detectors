services:
  api-service:
    build:
      context: ./services/api-service
    container_name: vibeshield-api
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 10
  auth-service:
    build:
      context: ./services/auth-service
    container_name: vibeshield-auth
    depends_on:
      - database

  langchain-service:
    build:
      context: ./services/langchain-service
    container_name: vibeshield-langchain
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      MODEL_NAME: ${LANGCHAIN_MODEL_NAME:-gpt-4o-mini}
    
    depends_on:
      - database

  client:
    build:
      context: ./client
      args:
        VITE_API_BASE_URL: ""
        VITE_AUTH_BASE_URL: /auth
    container_name: vibeshield-client
    expose:
      - "3000"
  gateway:
    image: nginx:alpine
    container_name: vibeshield-gateway
    ports:
      - "3000:80"
      - "3443:443"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./gateway/certs:/etc/nginx/certs:ro
    depends_on:
      - client
      - api-service
      - auth-service
      - langchain-service
  database:
    image: postgres:16
    container_name: vibeshield-db
    environment:
      POSTGRES_DB: vibeshield
      POSTGRES_USER: vibeshield
      POSTGRES_PASSWORD: vibeshield
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
volumes:
    postgres_data:
