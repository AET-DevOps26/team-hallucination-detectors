# Continuous Delivery.
#
# On merge to `main` (or manual dispatch): build & publish every service image to
# GHCR, then — only once ALL images are published — deploy them to Kubernetes.
# The `deploy` job `needs` `build-and-publish`, so it can never run against an
# image tag that hasn't been pushed yet (closes the publish/deploy race).
name: Build, Publish & Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main

# Don't run two deploys at once: let an in-flight pipeline finish, queue the next.
concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/aet-devops26/team-hallucination-detectors

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        service:
          - name: api-service
            context: ./services/api-service
          - name: auth-service
            context: ./services/auth-service
          - name: langchain-service
            context: ./services/langchain-service
          - name: scanner-service
            context: ./services/scanner-service
          - name: client
            context: ./client

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Derive immutable + convenience tags and OCI labels/annotations from the
      # git context. `sha-<commit>` is the immutable reference deploys pin to;
      # `latest` moves only on the default branch; semver tags appear on v* tags.
      - name: Derive tags & labels for ${{ matrix.service.name }}
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.service.name }}
          tags: |
            type=sha,prefix=sha-,format=long
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push ${{ matrix.service.name }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.service.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}

  deploy:
    # Gate: only deploy after every image above is built and pushed.
    needs: build-and-publish
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_AET }}" > ~/.kube/config
          chmod 600 ~/.kube/config

      # Pin to the immutable image tag published for this commit so the deploy
      # ships exactly the merged code (overrides values.yaml's `tag: latest`).
      # On a manual dispatch, github.sha is the SHA of the ref being run.

      # The vibeshield-secrets Secret may have been created outside Helm (e.g.
      # via kubectl apply). Helm refuses to manage resources it doesn't own, so
      # we adopt it by adding the required labels/annotations before upgrading.
      - name: Adopt existing secrets into Helm
        run: |
          kubectl annotate secret vibeshield-secrets -n ge65poj \
            meta.helm.sh/release-name=vibeshield \
            meta.helm.sh/release-namespace=ge65poj \
            --overwrite || true
          kubectl label secret vibeshield-secrets -n ge65poj \
            app.kubernetes.io/managed-by=Helm \
            --overwrite || true

      - name: Deploy with Helm
        env:
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT || '587' }}
          SMTP_USERNAME: ${{ vars.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          PASSWORD_RESET_MAIL_FROM: ${{ vars.PASSWORD_RESET_MAIL_FROM }}
        run: |
          for name in SMTP_HOST SMTP_USERNAME SMTP_PASSWORD PASSWORD_RESET_MAIL_FROM; do
            if [ -z "${!name}" ]; then
              echo "Required password-reset mail setting $name is missing" >&2
              exit 1
            fi
          done

          helm upgrade --install vibeshield ./helm/vibeshield -n ge65poj \
            --set-string images.tag=sha-${{ github.sha }} \
            --set-string secrets.jwtSecret=${{ secrets.APP_JWT_SECRET }} \
            --set-string secrets.dbPassword=${{ secrets.POSTGRES_PASSWORD }} \
            --set-string secrets.openaiApiKey=${{ secrets.OPENAI_API_KEY }} \
            --set-string secrets.logosApiKey=${{ secrets.LOGOS_API_KEY }} \
            --set-string authService.mail.host="$SMTP_HOST" \
            --set-string authService.mail.port="$SMTP_PORT" \
            --set-string authService.mail.username="$SMTP_USERNAME" \
            --set-string authService.mail.from="$PASSWORD_RESET_MAIL_FROM" \
            --set-string secrets.smtpPassword="$SMTP_PASSWORD"
          kubectl get pods -n ge65poj

      - name: Deploy monitoring stack
        run: |
          kubectl create serviceaccount prometheus -n ge65poj --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -f k8s/monitoring/rbac.yml || true
          kubectl apply -f k8s/monitoring/prometheus-configmap.yml
          kubectl apply -f k8s/monitoring/prometheus-pvc.yml
          kubectl apply -f k8s/monitoring/prometheus-deployment.yml
          kubectl apply -f k8s/monitoring/prometheus-service.yml
          kubectl apply -f k8s/monitoring/loki-configmap.yml
          kubectl apply -f k8s/monitoring/loki-pvc.yml
          kubectl apply -f k8s/monitoring/loki-deployment.yml
          kubectl apply -f k8s/monitoring/loki-service.yml
          kubectl apply -f k8s/monitoring/promtail-configmap.yml
          kubectl apply -f k8s/monitoring/promtail-daemonset.yml
          kubectl apply -f k8s/monitoring/tempo-configmap.yml
          kubectl apply -f k8s/monitoring/tempo-pvc.yml
          kubectl apply -f k8s/monitoring/tempo-deployment.yml
          kubectl apply -f k8s/monitoring/tempo-service.yml
          kubectl create secret generic grafana-credentials -n ge65poj \
            --from-literal=admin-user=admin \
            --from-literal=admin-password=${{ secrets.GRAFANA_ADMIN_PASSWORD }} \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -f k8s/monitoring/grafana-configmap.yml
          kubectl apply -f k8s/monitoring/grafana-dashboard-configmap.yml
          kubectl apply -f k8s/monitoring/grafana-pvc.yml
          kubectl apply -f k8s/monitoring/grafana-deployment.yml
          kubectl apply -f k8s/monitoring/grafana-service.yml
          kubectl apply -f k8s/monitoring/grafana-ingress.yml
          kubectl get pods -n ge65poj -l 'app in (prometheus,grafana,loki,tempo)'
