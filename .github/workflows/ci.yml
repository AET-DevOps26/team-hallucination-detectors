# Continuous Integration gate.
#
# Runs on every pull request targeting `main` (and on the merge commit once it
# lands). Each service is built and its tests run in an isolated, clearly-named
# job so each can be enforced as a required status check in branch protection.
# Any failure fails the run, blocking merge — this is the gate against an
# unstable `main`.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs for the same PR/branch to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # OpenAPI contract gate: the spec in api/ is the single source of truth.
  # Lints both contract files, then regenerates all language artefacts and
  # fails if the committed generated code drifts from the spec — this is what
  # makes "edit the spec first" enforceable rather than aspirational.
  openapi:
    name: openapi (lint + drift check)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: client/package-lock.json

      # The OpenAPI generator CLI runs a Java jar under the hood.
      - name: Set up JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Lint OpenAPI specs
        run: npx --yes @redocly/cli@1 lint

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Regenerate code from the contracts
        run: ./api/scripts/gen-all.sh

      - name: Fail if generated code drifts from the spec
        run: |
          GENERATED="client/src/api/schema.ts services/api-service/src/generated services/scanner-service/src/generated"
          git add -A $GENERATED
          if ! git diff --cached --exit-code -- $GENERATED; then
            echo "::error::Generated code is out of sync with api/*.yaml. Run ./api/scripts/gen-all.sh and commit the result."
            exit 1
          fi

  # Spring Boot services: compile + run the full test suite (tests are H2-backed,
  # so no external Postgres is needed). `gradle build` assembles the jar and runs
  # `test`/`check`, so it verifies both "build" and "tests" in one step.
  spring-services:
    name: spring (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - api-service
          - scanner-service
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "21"

      # No gradle wrapper is committed, so install the same Gradle version the
      # Dockerfiles build with (8.10.2) and cache its dependencies.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
        with:
          gradle-version: "8.10.2"

      - name: Build and test ${{ matrix.service }}
        working-directory: services/${{ matrix.service }}
        run: gradle build --no-daemon

      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-reports-${{ matrix.service }}
          path: services/${{ matrix.service }}/build/reports/tests/
          if-no-files-found: ignore

  # React client: type-check + production build, plus lint. No test script is
  # defined, so the build itself is the verification gate.
  client:
    name: client
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: client
        run: npm ci

      - name: Lint
        working-directory: client
        run: npm run lint

      - name: Test
        working-directory: client
        run: npm test

      - name: Build
        working-directory: client
        run: npm run build

  # Python GenAI service: install dependencies, byte-compile the package to
  # catch import/syntax errors, then run the pytest suite (chains + API,
  # with the LLM clients mocked — no network calls, no API keys needed).
  langchain-service:
    name: langchain-service
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/langchain-service/requirements-dev.txt

      - name: Install dependencies
        working-directory: services/langchain-service
        run: pip install -r requirements-dev.txt

      - name: Compile sources
        working-directory: services/langchain-service
        run: python -m compileall app

      - name: Test
        working-directory: services/langchain-service
        run: python -m pytest
