name: Deploy to Azure VM

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Clean old deployment on Azure VM
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        with:
          host: ${{ secrets.AZURE_PUBLIC_IP }}
          username: ${{ secrets.AZURE_USER }}
          key: ${{ secrets.AZURE_PRIVATE_KEY }}
          script: |
            cd ~/app && docker compose down --remove-orphans || true
            rm -rf ~/app
            mkdir -p ~/app/gateway/certs ~/certs
            if [ ! -f ~/certs/gateway.crt ]; then
              openssl req -x509 -nodes -days 3650 -newkey rsa:2048 \
                -keyout ~/certs/gateway.key -out ~/certs/gateway.crt \
                -subj '/CN=vibeshield' 2>/dev/null
            fi
            cp ~/certs/gateway.crt ~/certs/gateway.key ~/app/gateway/certs/ 2>/dev/null || true

      - name: Copy repository to Azure VM
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634 # v0.1.7
        with:
          host: ${{ secrets.AZURE_PUBLIC_IP }}
          username: ${{ secrets.AZURE_USER }}
          key: ${{ secrets.AZURE_PRIVATE_KEY }}
          source: "."
          target: "~/app"

      - name: Write .env and start services
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        env:
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT || '587' }}
          SMTP_USERNAME: ${{ vars.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          PASSWORD_RESET_MAIL_FROM: ${{ vars.PASSWORD_RESET_MAIL_FROM }}
          PASSWORD_RESET_PAGE_URL: ${{ vars.AZURE_PUBLIC_URL || format('http://{0}:3000', secrets.AZURE_PUBLIC_IP) }}/reset-password
        with:
          host: ${{ secrets.AZURE_PUBLIC_IP }}
          username: ${{ secrets.AZURE_USER }}
          key: ${{ secrets.AZURE_PRIVATE_KEY }}
          envs: SMTP_HOST,SMTP_PORT,SMTP_USERNAME,SMTP_PASSWORD,PASSWORD_RESET_MAIL_FROM,PASSWORD_RESET_PAGE_URL
          script: |
            cd ~/app

            for name in SMTP_HOST SMTP_USERNAME SMTP_PASSWORD PASSWORD_RESET_MAIL_FROM; do
              eval "value=\${$name}"
              if [ -z "$value" ]; then
                echo "Required password-reset mail setting $name is missing" >&2
                exit 1
              fi
            done

            # Write env file from GitHub Actions secrets so docker compose has all required vars
            umask 077
            cat > .env <<ENVEOF
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            SPRING_DATASOURCE_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            APP_JWT_SECRET=${{ secrets.APP_JWT_SECRET }}
            OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
            LANGCHAIN_MODEL_NAME=gpt-4o-mini
            SPRING_MAIL_HOST=$SMTP_HOST
            SPRING_MAIL_PORT=$SMTP_PORT
            SPRING_MAIL_USERNAME=$SMTP_USERNAME
            SPRING_MAIL_PASSWORD=$SMTP_PASSWORD
            SPRING_MAIL_SMTP_AUTH=true
            SPRING_MAIL_SMTP_STARTTLS_ENABLE=true
            PASSWORD_RESET_MAIL_FROM=$PASSWORD_RESET_MAIL_FROM
            PASSWORD_RESET_PAGE_URL=$PASSWORD_RESET_PAGE_URL
            ENVEOF

            docker compose pull --ignore-pull-failures || true
            docker compose up -d --build
            docker compose ps
