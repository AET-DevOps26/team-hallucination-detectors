name: Deploy Team Project

on:
  workflow_dispatch: # Allows you to click the manual "Run workflow" button
  push:
    branches: [ "main" ] # Runs automatically on merge to main

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Clean old files on Azure VM
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.AZURE_PUBLIC_IP }}
        username: ${{ secrets.AZURE_USER }}
        key: ${{ secrets.AZURE_PRIVATE_KEY }}
        script: |
          cd ~/app && docker compose down || true
          rm -rf ~/app
          mkdir -p ~/app/gateway/certs
          if [ ! -f ~/certs/gateway.crt ]; then
            openssl req -x509 -nodes -days 3650 -newkey rsa:2048 \
              -keyout ~/certs/gateway.key -out ~/certs/gateway.crt \
              -subj '/CN=vibeshield' 2>/dev/null
          fi
          cp ~/certs/gateway.crt ~/certs/gateway.key ~/app/gateway/certs/ 2>/dev/null || true

    - name: Copy Files to Azure VM via SCP
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.AZURE_PUBLIC_IP }}
        username: ${{ secrets.AZURE_USER }}
        key: ${{ secrets.AZURE_PRIVATE_KEY }}
        source: "."
        target: "~/app"

    - name: Execute Docker Compose Over SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.AZURE_PUBLIC_IP }}
        username: ${{ secrets.AZURE_USER }}
        key: ${{ secrets.AZURE_PRIVATE_KEY }}
        script: |
          cd ~/app
          docker compose up -d --build