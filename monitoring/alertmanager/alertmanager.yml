global:
  resolve_timeout: 5m

route:
  receiver: vibeshield-ui
  group_by: [alertname, job]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 3h

receivers:
  - name: vibeshield-ui

inhibit_rules:
  - source_matchers: [severity = "critical"]
    target_matchers: [severity = "warning"]
    equal: [job]