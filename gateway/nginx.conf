server {
    listen 80;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/ {
        proxy_pass http://api-service:8080;
    }

    location = /openapi.yaml {
        proxy_pass http://api-service:8080;
    }

    # Canonical versioned auth path from api/openapi.yaml. Longest-prefix match
    # wins over /api/, and the auth-service serves /api/v1/auth/* natively, so
    # no rewrite is needed.
    location /api/v1/auth/ {
        proxy_pass http://auth-service:8080;
    }

    location /auth/ {
        rewrite ^/auth/?(.*)$ /api/v1/auth/$1 break;
        proxy_pass http://auth-service:8080;
    }

    location /langchain/ {
        rewrite ^/langchain/?(.*)$ /$1 break;
        proxy_pass http://langchain-service:8000;
    }

    location / {
        proxy_pass http://client:3000;
    }
}

server {
    listen 443 ssl http2;

    ssl_certificate /etc/nginx/certs/gateway.crt;
    ssl_certificate_key /etc/nginx/certs/gateway.key;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    location /api/ {
        proxy_pass http://api-service:8080;
    }

    location = /openapi.yaml {
        proxy_pass http://api-service:8080;
    }

    # Canonical versioned auth path; see the port-80 server block above.
    location /api/v1/auth/ {
        proxy_pass http://auth-service:8080;
    }

    location /auth/ {
        rewrite ^/auth/?(.*)$ /api/v1/auth/$1 break;
        proxy_pass http://auth-service:8080;
    }

    location /langchain/ {
        rewrite ^/langchain/?(.*)$ /$1 break;
        proxy_pass http://langchain-service:8000;
    }

    location / {
        proxy_pass http://client:3000;
    }
}
