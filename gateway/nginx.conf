server {
    listen 80;
    resolver 127.0.0.11 valid=10s ipv6=off;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/ {
        set $api_upstream http://api-service:8080;
        proxy_pass $api_upstream;
    }

    location = /openapi.yaml {
        proxy_pass http://api-service:8080;
    }

    # Canonical versioned auth path from api/openapi.yaml. Longest-prefix match
    # wins over /api/, and the auth-service serves /api/v1/auth/* natively, so
    # no rewrite is needed.
    location ^~ /api/v1/auth/ {
        set $auth_upstream http://auth-service:8080;
        proxy_pass $auth_upstream;
    }

    location ^~ /auth/ {
        set $auth_upstream http://auth-service:8080;
        rewrite ^/auth/?(.*)$ /api/v1/auth/$1 break;
        proxy_pass $auth_upstream;
    }

    location /langchain/ {
        set $langchain_upstream http://langchain-service:8000;
        rewrite ^/langchain/?(.*)$ /$1 break;
        proxy_pass $langchain_upstream;
    }

    location / {
        set $client_upstream http://client:3000;
        proxy_pass $client_upstream;
    }
}

server {
    listen 443 ssl;
    http2 on;
    resolver 127.0.0.11 valid=10s ipv6=off;

    ssl_certificate /etc/nginx/certs/gateway.crt;
    ssl_certificate_key /etc/nginx/certs/gateway.key;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    location /api/ {
        set $api_upstream http://api-service:8080;
        proxy_pass $api_upstream;
    }

    location = /openapi.yaml {
        proxy_pass http://api-service:8080;
    }

    # Canonical versioned auth path; see the port-80 server block above.
    location ^~ /api/v1/auth/ {
        set $auth_upstream http://auth-service:8080;
        proxy_pass $auth_upstream;
    }

    location ^~ /auth/ {
        set $auth_upstream http://auth-service:8080;
        rewrite ^/auth/?(.*)$ /api/v1/auth/$1 break;
        proxy_pass $auth_upstream;
    }

    location /langchain/ {
        set $langchain_upstream http://langchain-service:8000;
        rewrite ^/langchain/?(.*)$ /$1 break;
        proxy_pass $langchain_upstream;
    }

    location / {
        set $client_upstream http://client:3000;
        proxy_pass $client_upstream;
    }
}
